[project]
name = "facet"
version = "0.1.0"
description = "Local webcam and voice mood monitor powered by Clef-flash"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.11",
  "torchvision",
  "transformers>=5.14",
  "accelerate",
  "safetensors",
  "huggingface_hub",
  "pillow",
  "numpy",
  "opencv-python",
  "mediapipe>=0.10.21,<0.11",
  "fastapi",
  "uvicorn[standard]",
  "sounddevice",
  "parakeet-mlx",
  "mlx-vlm>=0.7.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
facet = "facet.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facet"]
