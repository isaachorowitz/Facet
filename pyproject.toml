[project]
name = "facet"
version = "0.1.0"
description = "A private, on-device mirror for your face, posture, hands and voice, powered by Clef-flash on Apple Silicon"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Isaac Horowitz" }]
keywords = ["mlx", "apple-silicon", "webcam", "posture", "mood", "mediapipe", "local-first"]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.11",
  "torchvision",
  "transformers>=5.14",
  "accelerate",
  "safetensors",
  "huggingface_hub",
  "pillow",
  "numpy",
  "opencv-python",
  "mediapipe>=0.10.21,<0.11",
  "fastapi",
  "uvicorn[standard]",
  "sounddevice",
  "parakeet-mlx",
  "mlx-vlm>=0.7.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/isaachorowitz/Facet"

[project.scripts]
facet = "facet.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facet"]
